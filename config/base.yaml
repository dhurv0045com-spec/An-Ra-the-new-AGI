# config/base.yaml - AN-RA Base Configuration
# Fields match AnRaConfig exactly. All preset configs (tiny/small/medium/large) inherit from this.
# Load with: cfg = AnRaConfig.from_yaml(Path("config/base.yaml"))

experiment_name: base
seed: 42

model:
  type: causal_transformer_v2
  vocab_size: 8192
  n_embd: 512
  n_head: 8
  n_kv_head: 2
  n_layer: 12
  block_size: 2048
  dropout: 0.0
  mod_layers: [4, 8]
  use_hal: false

training:
  batch_size: 8
  learning_rate: 3.0e-4
  max_steps: 50000
  warmup_steps: 1000
  weight_decay: 0.1
  grad_clip: 1.0
  objective: cross_entropy
  rlvr_enabled: false
  star_enabled: false
  checkpoint_every: 1000
  eval_every: 500
