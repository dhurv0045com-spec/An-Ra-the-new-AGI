experiment_name: anra_v3_frontier
model:
  type: causal_transformer_v3
  vocab_size: 8209
  n_embd: 1536
  n_layer: 36
  n_head: 16
  n_kv_head: 4
  d_ff: 4096
  block_size: 2048
  dropout: 0.0
  tie_weights: true
  use_mod: true
  mod_layers: [4, 8, 12, 16, 20, 24, 28, 32]
  mod_capacity: 0.5
  use_hal: true
  gradient_checkpointing: true
training:
  dataset_path: data/anra_v3/train
  val_dataset_path: data/anra_v3/validation
  tokenizer_path: tokenizer/tokenizer_v3.json
  seq_len: 2048
  batch_size: 1
  gradient_accumulation: 64
  max_steps: 100000
  checkpoint_every: 1000
  eval_every: 1000
  eval_steps: 50
