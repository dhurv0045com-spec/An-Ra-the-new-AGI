experiment_name: anra_v3_draft
model:
  type: causal_transformer_v3
  vocab_size: 8209
  n_embd: 256
  n_layer: 8
  n_head: 4
  n_kv_head: 2
  d_ff: 704
  block_size: 2048
  dropout: 0.0
  tie_weights: true
  use_mod: false
  mod_layers: []
  use_hal: false
  gradient_checkpointing: false
training:
  dataset_path: data/anra_v3/train
  val_dataset_path: data/anra_v3/validation
  tokenizer_path: tokenizer/tokenizer_v3.json
  seq_len: 2048
  batch_size: 4
  gradient_accumulation: 16
  max_steps: 50000
  checkpoint_every: 1000
  eval_every: 1000
  eval_steps: 50
