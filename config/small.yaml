experiment_name: small
seed: 42
model:
  type: causal_transformer_v2
  vocab_size: 8192
  n_embd: 256
  n_head: 4
  n_kv_head: 2
  n_layer: 8
  block_size: 1024
  dropout: 0.05
  mod_layers: [3, 6]
  use_hal: false
training:
  batch_size: 6
  learning_rate: 5.0e-4
  max_steps: 20000
  warmup_steps: 500
  weight_decay: 0.1
  grad_clip: 1.0
  objective: cross_entropy
  rlvr_enabled: false
  star_enabled: false
  checkpoint_every: 500
  eval_every: 250
  entropy_coef: 0.01
