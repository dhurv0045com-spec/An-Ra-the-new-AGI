experiment_name: small
seed: 42
model:
  type: causal_transformer_v2
  vocab_size: 8192
  n_embd: 256
  n_head: 4
  n_kv_head: 2
  n_layer: 6
  block_size: 1024
  dropout: 0.0
  mod_layers: []
  use_hal: false
training:
  batch_size: 4
  learning_rate: 1.0e-3
  max_steps: 20000
  warmup_steps: 200
  weight_decay: 0.1
  grad_clip: 1.0
  objective: cross_entropy
