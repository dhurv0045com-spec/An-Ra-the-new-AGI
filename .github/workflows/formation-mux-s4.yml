name: FORMATION-MUX S5 + frontier CPU qualification

on:
  push:
    branches: [cymek-next-core-architecture]
    paths:
      - 'anra_v5/formation_mux_*'
      - 'anra_v5/tie_role_*'
      - 'v5_experiments/formation_mux_*'
      - 'v5_experiments/tie_role_*'
      - 'tools/formation_mux_001_*'
      - 'tests/test_formation_mux_*'
      - 'notebooks/CYMEK_FORMATION_MUX_001_KAGGLE_T4X2.ipynb'
      - 'docs/cymek/experiments/FORMATION-MUX-001/**'
      - 'docs/cymek/experiments/CS-MECH-002/**'
      - 'docs/cymek/experiments/REP-FORM-003A/**'
      - '.github/workflows/formation-mux-s4.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install targeted dependencies matching current Kaggle tokenizer line
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy 'tokenizers==0.23.0rc0'
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile S5, X-factor, and frontier execution surface
        run: |
          python -m py_compile \
            anra_v5/formation_mux_model_v3.py \
            anra_v5/formation_mux_train_v5.py \
            anra_v5/tie_role_model_v1.py \
            anra_v5/tie_role_train_v1.py \
            v5_experiments/formation_mux_protocol_v5.py \
            v5_experiments/formation_mux_surface_v5.py \
            v5_experiments/tie_role_protocol_v1.py \
            tools/formation_mux_001_worker_v5.py \
            tools/formation_mux_001_vocab_pressure_v1.py \
            tools/formation_mux_001_tie_role_worker_v1.py \
            tools/formation_mux_001_tie_role_gradient_diag_v1.py \
            tools/formation_mux_001_kaggle_operator_v8.py \
            tools/formation_mux_001_kaggle_operator_v9.py \
            tools/formation_mux_001_kaggle_operator_v10.py \
            tools/formation_mux_001_kaggle_operator_v11.py
      - name: Run FORMATION-MUX qualification tests
        run: |
          python -m pytest -q \
            tests/test_formation_mux_001_v2.py \
            tests/test_formation_mux_001_v3.py \
            tests/test_formation_mux_001_v4.py \
            tests/test_formation_mux_001_v5.py \
            tests/test_formation_mux_surface_v2.py \
            tests/test_formation_mux_vocab_pressure_v1.py \
            tests/test_formation_mux_tie_role_v1.py
      - name: Verify immutable S5, preregistrations, and real-tokenizer 60k public surface
        run: |
          python - <<'PY'
          from pathlib import Path
          from tools import formation_mux_001_kaggle_operator_v11 as op11
          from tools import formation_mux_001_kaggle_operator_v10 as op
          from v5_data.corpus_loading import _load_tokenizer
          from v5_experiments.formation_mux_surface_v5 import build_public_surface, regenerate_sealed_rows
          from v5_experiments import tie_role_protocol_v1 as frontier

          repo = Path('.').resolve()
          hashes = op.v9.v8.v7.base.verify_science(repo)
          assert set(hashes) == set(op.v9.v8.SCIENCE_FILES)
          xreceipt = op.v9.verify_xfactor_preregistration(repo)
          assert xreceipt['diagnostic'] == 'VOCAB-PRESSURE-001'
          assert xreceipt['sha256'] == op.v9.XFACTOR_SPEC_SHA256
          freceipt = op.verify_frontier_preregistration(repo)
          assert freceipt['extension'] == 'TIE-ROLE-FRONTIER-001'
          assert freceipt['prospective'] is True
          assert frontier.total_official_arms() == 24
          assert callable(op11._rebind_s5_training)
          tok, _ = _load_tokenizer(repo)
          public = build_public_surface(seed=73011, tokenizer=tok)
          assert set(public['splits']) == {'training', 'development'}
          assert public['sealed_rows_persisted'] is False
          assert len(public['splits']['training']) == 60000
          assert len(public['splits']['development']) == 480
          assert public['training_rows_unique_before_stream_wrap'] == 60000
          for exp in op.v9.v8.proto.EXPERIMENTS:
              sealed = regenerate_sealed_rows(public_manifest=public, tokenizer=tok, experiment=exp)
              assert len(sealed) == 720
              del sealed
          print('S5_XFACTOR_FRONTIER_AND_REAL_TOKENIZER_SURFACE_PASS', len(hashes))
          PY
      - name: Validate canonical notebook JSON, code cells, and pins
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('notebooks/CYMEK_FORMATION_MUX_001_KAGGLE_T4X2.ipynb')
          nb = json.loads(p.read_text(encoding='utf-8'))
          assert nb['nbformat'] == 4
          assert nb['metadata']['schema'] == 'anra.formation-mux-notebook/v10'
          assert nb['metadata']['science_commit'] == 'c15ad8beb409537db42d075684ea54847a074ebd'
          assert nb['metadata']['operator_commit'] == '42c9d7ec6da43bc67f521d0ba200683962f1cea1'
          assert nb['metadata']['operator_blob'] == '0b4ced9fa2f5a628abf9b348455b6e8f18b18425'
          assert nb['metadata']['xfactor'] == 'VOCAB-PRESSURE-001'
          assert nb['metadata']['frontier_extension'] == 'TIE-ROLE-FRONTIER-001'
          for index, cell in enumerate(nb['cells']):
              if cell.get('cell_type') == 'code':
                  compile(''.join(cell.get('source', [])), f'notebook-cell-{index}', 'exec')
          print('CANONICAL_NOTEBOOK_S5_XFACTOR_FRONTIER_PIN_PASS')
          PY
