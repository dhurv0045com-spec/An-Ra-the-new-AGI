name: deterministic-contracts

on:
  push:
    branches: [core-exp]
  pull_request:
    branches: [core-exp]

jobs:
  cpu-contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # torch comes from the CPU wheel index; pytest comes from PyPI.
      # Separate installs: the torch index does not host pytest.
      - name: Install torch (CPU), then pytest
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install pytest

      - name: Run deterministic contract tests
        run: |
          python -m pytest tests/test_query_influence.py \
                            tests/test_grouped_queryswap_contracts.py \
                            tests/test_qim_v3_corrective.py \
                            tests/test_evidence_chain_invariants.py \
                            tests/test_repro_and_intervention.py \
                            tests/test_margin_experiment.py \
                            tests/test_cognitive_credit.py \
                            -q
