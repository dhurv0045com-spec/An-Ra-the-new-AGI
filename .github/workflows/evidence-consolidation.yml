name: Evidence consolidation validation

on:
  push:
    branches:
      - research/evidence-consolidation-2026-09-25
  pull_request:
    paths:
      - "docs/**"
      - "experiments/**"
      - "artifacts/**"
      - "engineering/**"
      - "tools/validate_evidence_ledger.py"
      - "tools/validate_research_decision_model.py"
      - "tests/test_research_consolidation.py"
      - ".github/workflows/evidence-consolidation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Validate evidence ledger
        run: python -B tools/validate_evidence_ledger.py
      - name: Validate research decision model
        run: python -B tools/validate_research_decision_model.py
      - name: Run focused consolidation tests
        run: python -B -m pytest -p no:cacheprovider tests/test_research_consolidation.py
      - name: Check authored patch whitespace
        run: >-
          git show --check --oneline --no-renames HEAD -- .
          ':(exclude)artifacts/cymek/FORMATION-MUX-001/kaggle-session-20260923/SESSION_REPORT.md'
          ':(exclude)docs/cymek/experiments/CYR-GPU-014-R1C/FINAL_RESULT.md'
          ':(exclude)docs/cymek/experiments/FORMATION-MUX-001/observed/S5_KAGGLE_2026-09-15/POSTMORTEM.md'
