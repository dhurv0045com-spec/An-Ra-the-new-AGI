name: X-FACTOR-PILOT-001 executable qualification

on:
  push:
    branches: [cymek-beta]
    paths:
      - 'anra_v5/x_factor_pilot_*'
      - 'v5_experiments/x_factor_pilot_*'
      - 'tools/x_factor_pilot_*'
      - 'tests/test_x_factor_pilot_v1.py'
      - 'experiments/COLAB/build_x_factor_pilot_kaggle.py'
      - 'notebooks/X_FACTOR_PILOT_001_KAGGLE_T4X2.ipynb'
      - '.github/workflows/x-factor-pilot.yml'
  pull_request:
    branches: [cymek-beta]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install targeted dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy 'tokenizers==0.23.0rc0'
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile pilot execution surface
        run: |
          python -m py_compile \
            v5_experiments/x_factor_pilot_protocol_v1.py \
            anra_v5/x_factor_pilot_model_v1.py \
            anra_v5/x_factor_pilot_train_v1.py \
            tools/x_factor_pilot_001_worker_v1.py \
            tools/x_factor_pilot_001_kaggle_operator_v1.py \
            experiments/COLAB/build_x_factor_pilot_kaggle.py \
            tests/test_x_factor_pilot_v1.py
      - name: Run pilot unit tests
        run: |
          python -m pytest -q tests/test_x_factor_pilot_v1.py
      - name: Emit immutable pilot pins
        run: |
          python -c "from v5_experiments import x_factor_pilot_protocol_v1 as p; print('PROTOCOL_HASH=' + p.protocol_sha256())"
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)"
          echo "OPERATOR_BLOB=$(git hash-object tools/x_factor_pilot_001_kaggle_operator_v1.py)"
      - name: Verify generated notebook
        run: |
          python experiments/COLAB/build_x_factor_pilot_kaggle.py
          git diff --exit-code -- notebooks/X_FACTOR_PILOT_001_KAGGLE_T4X2.ipynb
      - name: Validate notebook JSON and code cells
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('notebooks/X_FACTOR_PILOT_001_KAGGLE_T4X2.ipynb')
          notebook = json.loads(path.read_text(encoding='utf-8'))
          assert notebook['nbformat'] == 4
          assert notebook['metadata']['accelerator'] == 'GPU T4 x2'
          assert notebook['metadata']['campaign'] == 'X-FACTOR-PILOT-001'
          for index, cell in enumerate(notebook['cells']):
              if cell.get('cell_type') == 'code':
                  compile(''.join(cell.get('source', [])), f'x-factor-cell-{index}', 'exec')
          print('X_FACTOR_NOTEBOOK_JSON_PASS')
          PY
