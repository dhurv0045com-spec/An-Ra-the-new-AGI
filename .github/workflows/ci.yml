name: An-Ra CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Verify structure
        run: python -m scripts.verify_structure

      - name: Run unit and integration tests
        run: |
          python -m pytest tests/ \
            -x -q \
            --timeout=120 \
            -m "not gpu" \
            --ignore=tests/test_drive_session_manager_integration.py \
            --ignore=tests/test_v2_drive_artifacts.py
        env:
          PYTHONPATH: .

      - name: Run type checking on anra package
        run: mypy anra/ --strict --ignore-missing-imports

      - name: Run linting
        run: ruff check anra/ tests/

      - name: Check no hardcoded /content/ paths
        run: python -m pytest tests/test_no_hardcoded_root_paths.py -v

      - name: Innovation cycle dry run
        run: python scripts/run_innovation_cycle.py
        env:
          PYTHONPATH: .

      - name: Verify no sys.path violations
        run: python -m pytest tests/test_ci_health.py::test_no_sys_path_in_any_non_deprecated_file -v
        env:
          PYTHONPATH: .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Verify imports
        run: |
          python -c "from anra.core.model import CausalTransformerV2; print('OK')"
          python -c "import anra; print(anra.__version__)"
        env:
          PYTHONPATH: .
      - name: Lint
        run: ruff check anra/ tests/
        env:
          PYTHONPATH: .
      - name: Type check
        run: mypy anra/ --strict --ignore-missing-imports
        env:
          PYTHONPATH: .
