name: ELENDRIL CPU reference

on:
  push:
    branches: [Elendril]
  pull_request:
    branches: [Elendril]

permissions:
  contents: read

jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - run: python -m pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Check ELENDRIL and shared contracts
        run: >-
          python -m pytest -q
          tests/test_elendril.py tests/test_elendril_longitudinal.py tests/test_elendril_relational.py
          tests/test_v5_checkpointing.py tests/test_v5_durability_contracts.py
          tests/test_v5_model.py tests/test_v5_tokenizer.py
      - run: python -m anra_v5.elendril audit --output elendril-fixture-audit.json
