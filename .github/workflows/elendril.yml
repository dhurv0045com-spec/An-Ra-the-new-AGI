name: ELENDRIL mechanics and operator contracts

on:
  push:
    branches: [Elendril]
  pull_request:
    branches: [Elendril]

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
      - run: python -m elendril audit --output elendril-fixture-audit.json
