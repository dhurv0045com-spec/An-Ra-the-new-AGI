name: ESOES research contracts

on:
  push:
    branches: [esoes]
  pull_request:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run E0 regression tests
        run: python -m unittest discover -s tests -v
      - name: Enforce package boundaries
        run: python -m v5_contracts.import_boundaries
      - name: Reproduce development certificate
        run: python -m e0_cognition.certify --output /tmp/development_certificate.json --groups-per-family 16
      - name: Verify committed receipt is reproducible
        run: cmp artifacts/e0/development_certificate.json /tmp/development_certificate.json
      - name: Reproduce scoring-adapter contract
        run: python -m e0_cognition.scoring_certification --output /tmp/scoring_adapter_certificate.json
      - name: Verify scoring-adapter receipt is reproducible
        run: cmp artifacts/e0/scoring_adapter_certificate.json /tmp/scoring_adapter_certificate.json
      - name: Reproduce committed CPU/CUDA scorer parity
        run: python -m e2_architecture.scoring_benchmark compare --cpu artifacts/e2/local_cpu_scoring_null.json --cuda artifacts/e2/local_cuda_scoring_null.json --output /tmp/local_cpu_cuda_scoring_parity.json
      - name: Verify committed scorer parity receipt
        run: cmp artifacts/e2/local_cpu_cuda_scoring_parity.json /tmp/local_cpu_cuda_scoring_parity.json
      - name: Reproduce 250M implementation contract
        run: python -m v5_contracts.certify --output /tmp/implementation_contract.json
      - name: Verify committed implementation receipt
        run: cmp artifacts/v5/implementation_contract.json /tmp/implementation_contract.json
      - name: Reproduce training transaction canary
        run: python -m v5_training.transaction_canary --output /tmp/training_transaction_canary.json
      - name: Verify training transaction receipt is reproducible
        run: cmp artifacts/v5/training_transaction_canary.json /tmp/training_transaction_canary.json
      - name: Reproduce local durability canary
        run: python -m v5_training.durability_canary --output /tmp/local_durability_canary.json
      - name: Verify local durability receipt is reproducible
        run: cmp artifacts/v5/local_durability_canary.json /tmp/local_durability_canary.json
      - name: Reproduce E1 matched-budget tournament plan
        run: python -m e1_tokenizer.tournament --output /tmp/tournament_plan.json
      - name: Verify committed E1 tournament plan
        run: cmp artifacts/e1/tournament_plan.json /tmp/tournament_plan.json
