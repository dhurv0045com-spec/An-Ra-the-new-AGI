name: V16 branch preflight (CPU only)

on:
  push:
    branches:
      - review/v16-preflight-2026-11-12
      - opposing-star
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # archived experiment/source pins require complete history and tags
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU test dependencies (no GPU training)
        run: |
          python -m pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[test]"
      - name: Compile V16 source and notebook cells
        run: |
          python -m compileall -q tools/elendril_v716_campaign.py tools/elendril_v716_worker.py tools/elendril_v716_report.py anra_v5/elendril/v716_training.py
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("notebooks/ELENDRIL_V716_HYPOTHESIS_KAGGLE_T4X2.ipynb")
          notebook = json.loads(path.read_text(encoding="utf-8"))
          for idx, cell in enumerate(notebook["cells"]):
              if cell["cell_type"] == "code":
                  compile("".join(cell["source"]), f"{path}:cell{idx}", "exec")
          config = "".join(notebook["cells"][1]["source"])
          assert "RUN_STUDY = False" in config
          print("V16 cells parse and owner launch defaults OFF")
          PY
      - name: V16 bounded CPU contract tests
        run: python -m pytest -q tests/test_v716_contracts.py
      - name: Repository-wide CPU regression
        run: python -m pytest -q
      - name: Evidence verification (fixtures only)
        run: |
          python -m elendril audit --output elendril-fixture-audit.json
          python -m tools.verify_elendril_evidence
