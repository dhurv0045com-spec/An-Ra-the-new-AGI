[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "anra-core"
version = "0.6.0"
description = "An-Ra: exact dense V4 Core, Connector runtime, and verified experiment infrastructure"
requires-python = ">=3.10"
dependencies = ["torch>=2.5"]

[project.scripts]
anra-core = "anra_core.__main__:main"

[tool.setuptools.packages.find]
include = ["anra_core*", "connector*", "anra*"]

[tool.setuptools.package-data]
anra_core = ["assets/*.json"]

[tool.ruff]
target-version = "py310"
line-length = 100
