[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "elendril-research"
version = "0.3.0"
description = "Reproducible neural relational learning and independent intervention research"
requires-python = ">=3.11"
readme = "README.md"

[project.optional-dependencies]
train = ["torch>=2.8,<3"]
test = ["pytest>=8,<10", "nbformat>=5.10,<6"]

[project.scripts]
elendril = "anra_v5.elendril.__main__:main"

[tool.setuptools]
py-modules = ["v5_checkpointing"]

[tool.setuptools.packages.find]
include = ["elendril", "anra_v5", "anra_v5.elendril*", "v5_contracts", "v5_data", "v5_evaluation", "v5_model", "v5_objectives", "v5_training"]

[tool.pytest.ini_options]
testpaths = ["tests"]
