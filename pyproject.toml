[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "anra-core"
version = "1.0.0"
description = "The inference-only dense core of An-Ra V4"
requires-python = ">=3.10"
dependencies = ["torch>=2.2"]

[project.scripts]
anra-core = "anra_core.__main__:main"

[tool.setuptools.packages.find]
include = ["anra_core*"]

[tool.setuptools.package-data]
anra_core = ["assets/*.json"]

[tool.ruff]
target-version = "py310"
line-length = 100
