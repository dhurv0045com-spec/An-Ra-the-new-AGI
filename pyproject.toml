[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "anra"
version = "0.3.0"
description = "AN-RA sovereign AGI research platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AN-RA Research" }]
dependencies = [
  "accelerate==1.12.0",
  "aiosqlite==0.22.0",
  "faiss-cpu==1.13.1",
  "fastapi==0.124.0",
  "gitpython==3.1.45",
  "httpx==0.28.1",
  "networkx==3.6.1",
  "numpy==2.4.4",
  "psutil==7.1.3",
  "pydantic==2.12.5",
  "PyYAML==6.0.3",
  "scipy==1.16.3",
  "sentence-transformers==5.1.2",
  "sympy==1.14.0",
  "tokenizers==0.22.1",
  "torch==2.11.0",
  "tqdm==4.67.1",
  "transformers==4.57.3",
  "uvicorn==0.38.0",
]

[project.optional-dependencies]
dev = [
  "mypy==1.19.0",
  "pytest==9.0.3",
  "pytest-asyncio==1.3.0",
  "ruff==0.14.6",
  "types-PyYAML==6.0.12.20250915",
  "tomli>=2.0.0; python_version < '3.11'",
]
observability = [
  "tensorboard==2.20.0",
  "wandb==0.23.0",
]

[tool.setuptools.packages.find]
include = ["anra*"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "gpu: tests that require a CUDA-capable GPU",
]
filterwarnings = ["error::DeprecationWarning"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true
packages = ["anra"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["anra", "tests"]

[tool.ruff.lint]
select = [
  "A",
  "ANN",
  "ARG",
  "B",
  "C4",
  "E",
  "F",
  "I",
  "N",
  "PT",
  "RET",
  "SIM",
  "UP",
  "W",
]
ignore = [
  "A003",
  "ANN401",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN201", "S101"]
