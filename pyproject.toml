[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "anra"
version = "0.3.0"
description = "AN-RA sovereign AGI research platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AN-RA Research" }]
dependencies = [
  "aiosqlite>=0.19.0",
  "fastapi>=0.110.0",
  "gitpython>=3.1.40",
  "httpx>=0.27.0",
  "networkx>=3.2.0",
  "numpy>=1.26.0",
  "psutil>=5.9.0; platform_system != 'Android'",
  "pydantic>=2.5.0",
  "PyYAML>=6.0.0",
  "scipy>=1.12.0",
  "sympy>=1.12.0",
  "torch>=2.2.0",
  "tqdm>=4.66.0",
  "uvicorn>=0.27.0",
]

[project.optional-dependencies]
ml-extras = [
  "accelerate>=1.0.0",
  "sentence-transformers>=2.6.0",
  "transformers>=4.40.0",
  "tokenizers>=0.19.0",
  "faiss-cpu>=1.7.4",
]
dev = [
  "mypy==1.19.0",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.3.0",
  "types-PyYAML==6.0.12.20250915",
]
observability = [
  "tensorboard==2.20.0",
  "wandb==0.23.0",
]

[tool.setuptools.packages.find]
include = [
  "anra*",
  "engine*",
  "identity*",
  "inference*",
  "innovation*",
  "memory*",
  "phase2*",
  "phase3*",
  "runtime*",
  "scripts*",
  "tokenizer*",
  "training*",
]

[tool.setuptools]
py-modules = [
  "anra_brain",
  "anra_paths",
  "app",
  "generate",
  "startup_checks",
]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "gpu: tests that require a CUDA-capable GPU",
]
filterwarnings = ["error::DeprecationWarning"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true
packages = ["anra"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["anra", "tests"]

[tool.ruff.lint]
select = [
  "A",
  "ANN",
  "ARG",
  "B",
  "C4",
  "E",
  "F",
  "I",
  "N",
  "PT",
  "RET",
  "SIM",
  "UP",
  "W",
]
ignore = [
  "A003",
  "ANN401",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN201", "S101"]
