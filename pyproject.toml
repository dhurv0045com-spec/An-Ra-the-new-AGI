[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "elendril-research"
version = "0.3.0"
description = "Reproducible neural relational learning and independent intervention research"
requires-python = ">=3.11"
readme = "README.md"

[project.optional-dependencies]
train = ["torch>=2.8,<3", "numpy>=1.26,<3"]
test = ["numpy>=1.26,<3", "pytest>=8,<10", "nbformat>=5.10,<6"]

[project.scripts]
elendril = "anra_v5.elendril.__main__:main"
palantiri = "anra_v5.palantiri.__main__:main"
planter = "anra_v5.planter.__main__:main"
planthir = "anra_v5.planthir.__main__:main"

[tool.setuptools]
py-modules = ["v5_checkpointing"]

[tool.setuptools.packages.find]
include = ["experiments.avendi_y3*", "elendril", "anra_v5", "anra_v5.elendril*", "anra_v5.palantiri*", "anra_v5.planter*", "anra_v5.planthir*", "v5_contracts", "v5_data", "v5_evaluation", "v5_model", "v5_objectives", "v5_training"]

[tool.pytest.ini_options]
testpaths = ["tests"]
