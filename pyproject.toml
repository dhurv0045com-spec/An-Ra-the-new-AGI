[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "anra-esoes-research"
version = "0.7.0"
description = "Executable ESOES cognition, tokenizer, architecture, data/objective, and V5 training contracts"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
esoes-e0-certify = "e0_cognition.certify:main"
esoes-e0-scoring = "e0_cognition.scoring_certification:main"
esoes-v5-contracts = "v5_contracts.certify:main"
esoes-v5-training-spec = "v5_contracts.training_spec:main"
esoes-v5-readiness = "v5_contracts.launch_readiness:main"
esoes-e0-seal = "e0_cognition.sealed:main"
esoes-e1-audit = "e1_tokenizer.audit:main"
esoes-e1-plan = "e1_tokenizer.tournament:main"
esoes-e1-local = "e1_tokenizer.local_tournament:main"
esoes-e1-perturbation-sweep = "e1_tokenizer.perturbation_sweep:main"
esoes-e2-plan = "e2_architecture.plan:main"
esoes-e2-device = "e2_architecture.device_benchmark:main"
esoes-e2-device-aggregate = "e2_architecture.aggregate:main"
esoes-e2-block = "e2_architecture.block_benchmark:main"
esoes-e2-block-aggregate = "e2_architecture.block_aggregate:main"
esoes-e2-signal = "e2_architecture.signal_benchmark:main"
esoes-e2-qk-norm = "e2_architecture.qk_norm_benchmark:main"
esoes-e2-precision = "e2_architecture.precision_benchmark:main"
esoes-e2-rope = "e2_architecture.rope_benchmark:main"
esoes-e2-update = "e2_architecture.update_benchmark:main"
esoes-e2-cursor = "e2_architecture.cursor_benchmark:main"
esoes-e2-scoring = "e2_architecture.scoring_benchmark:main"
esoes-e2-scoring-policy-plan = "e2_architecture.scoring_policy:main"
esoes-e2-scoring-policy-fixture = "e2_architecture.scoring_policy_fixture:main"
esoes-e2-scoring-policy-tournament = "e2_architecture.scoring_policy_tournament:main"
esoes-e3-plan = "e3_data_objective.plan:main"
esoes-v5-transaction = "v5_training.transaction_canary:main"
esoes-v5-p35-canary = "v5_training.torch_canary:main"
esoes-v5-durability = "v5_training.durability_canary:main"
esoes-v5-target-preflight = "v5_training.target_preflight:main"
esoes-boundaries = "v5_contracts.import_boundaries:main"
senora-audit = "senora.audit:main"
senora-p35-plan = "senora.experiment_design:main"
senora-launcher = "senora.remote_launcher:main"
senora-dry-run = "senora.dry_run:main"
senora-canary = "senora.canary:main"
senora-run = "senora.run_experiment:main"
senora-cost = "senora.cost_model:main"
senora-package = "senora.remote_package:main"
senora-classify = "senora.result_classifier:main"

[tool.setuptools.packages.find]
include = ["e0_cognition*", "v5_contracts*", "v5_training*", "e1_tokenizer*", "e2_architecture*", "e3_data_objective*", "senora*"]
